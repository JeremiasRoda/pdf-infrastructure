# ==============================================================================
# Docker Compose - Integración Completa con HashiCorp Consul y Traefik v3.6
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Traefik v3.6 - Ingress Gateway y Balanceador de Carga
  # Integra el proveedor 'consulCatalog' para descubrimiento dinámico de microservicios
  # Mantiene 'docker' exclusivamente para el dashboard interno
  # ----------------------------------------------------------------------------
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      pdf-network:
        aliases:
          - extractor.universidad.localhost
          - documents.universidad.localhost
          - api.universidad.localhost
    depends_on:
      consul:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DASHBOARD_DOMAIN:-traefik.universidad.localhost}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080"

  # ----------------------------------------------------------------------------
  # HashiCorp Consul - Catálogo y Registro Dinámico de Servicios
  # Servidor único con almacenamiento persistente para entorno local e integración
  # ----------------------------------------------------------------------------
  consul:
    image: hashicorp/consul:2.0.4
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command:
      - "agent"
      - "-server"
      - "-bootstrap-expect=1"
      - "-ui"
      - "-client=0.0.0.0"
      - "-bind=0.0.0.0"
      - "-data-dir=/consul/data"
    ports:
      - "127.0.0.1:${CONSUL_HTTP_PORT:-8500}:8500"
    volumes:
      - consul_data:/consul/data
    networks:
      - pdf-network
    healthcheck:
      test: ["CMD", "consul", "info"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------------------
  # Consul Registrator - Sincronizador Dinámico de Contenedores Docker a Consul
  # Detecta inicio, detención y escalado en tiempo real; registra IPs individuales
  # ----------------------------------------------------------------------------
  registrator:
    build:
      context: ./registrator
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pdf-network
    environment:
      - CONSUL_HTTP_ADDR=http://consul:8500
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
      - TARGET_NETWORK=pdf-network
      - RECONCILE_INTERVAL=10
    depends_on:
      consul:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  # ----------------------------------------------------------------------------
  # Microservicio Extractor (Stateless y Escalable Horizontalmente)
  # Factor IX: init: true para propagar SIGTERM y stop_grace_period para drenado
  # Descubierto dinámicamente por Traefik a través del catálogo de Consul
  # ----------------------------------------------------------------------------
  extractor:
    build:
      context: ../pdf-extractor-service
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    networks:
      - pdf-network
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CACHE_ENABLED=${CACHE_ENABLED:-false}
      - METRICS_ENABLED=true
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-25}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      # Desactivado para Docker Provider para evitar colisión/duplicación con ConsulCatalog
      - "traefik.enable=false"

  # ----------------------------------------------------------------------------
  # Base de Datos MongoDB (Persistencia aislada para Document Service)
  # ----------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks:
      - pdf-network
    volumes:
      - mongodb_data:/data/db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Microservicio Document Service (Gestión de Documentos y Persistencia)
  # Descubierto dinámicamente por Traefik a través del catálogo de Consul
  # ----------------------------------------------------------------------------
  documents:
    build:
      context: ../pdf-document-service
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks:
      - pdf-network
    environment:
      - PORT=8000
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=${MONGODB_DATABASE:-pdf_extractext_integration}
      - MONGODB_TIMEOUT_MS=1500
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      # Desactivado para Docker Provider para evitar colisión con ConsulCatalog
      - "traefik.enable=false"

  # ----------------------------------------------------------------------------
  # Microservicio API Orchestrator (Punto de Entrada del Pipeline)
  # Descubierto dinámicamente por Traefik a través del catálogo de Consul
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ../pdf-api-service
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks:
      - pdf-network
    environment:
      - PORT=8000
      - EXTRACTOR_URL=http://extractor.universidad.localhost
      - DOCUMENT_SERVICE_URL=http://documents.universidad.localhost
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MAX_UPLOAD_BYTES=20971520
      - MAX_CONCURRENT_REQUESTS=2
      - EXTRACTOR_TIMEOUT_SECONDS=${EXTRACTOR_TIMEOUT_SECONDS:-30}
      - DOCUMENT_TIMEOUT_SECONDS=${DOCUMENT_TIMEOUT_SECONDS:-5}
      - READY_CHECK_TIMEOUT_SECONDS=${READY_CHECK_TIMEOUT_SECONDS:-2}
    depends_on:
      extractor:
        condition: service_healthy
      documents:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: "536870912"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      # Desactivado para Docker Provider para evitar colisión con ConsulCatalog
      - "traefik.enable=false"

  # ----------------------------------------------------------------------------
  # Dragonfly Cache (Perfil 'cache' para optimización POST-BASELINE)
  # Drop-in replacement de Redis de alto rendimiento, multi-threaded
  # Solo se levanta explícitamente con '--profile cache'
  # ----------------------------------------------------------------------------
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.2
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    profiles:
      - cache
    networks:
      pdf-network:
        aliases:
          - redis
    command: ["--logtostderr"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ----------------------------------------------------------------------------
  # Stack de Observabilidad Centralizado (Prometheus & Grafana) - Factor XI
  # Perfil condicional 'monitoring': docker compose --profile monitoring up -d
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    init: true
    profiles:
      - monitoring
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - pdf-network
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  grafana:
    image: grafana/grafana-oss:11.4.0
    restart: unless-stopped
    init: true
    profiles:
      - monitoring
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - pdf-network
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  mongodb_data:
  consul_data:

networks:
  pdf-network:
    external: true
