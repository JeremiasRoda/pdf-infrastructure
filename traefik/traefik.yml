# ==============================================================================
# Traefik v3 - Configuración Estática
# Infraestructura de Microservicios PDF
# ==============================================================================

# EntryPoints (Puntos de entrada de red)
entryPoints:
  web:
    address: ":80"
  traefik:
    address: ":8080"

# API y Dashboard de auditoría y monitoreo
api:
  dashboard: true
  insecure: true

# Endpoint de salud de Traefik (/ping)
ping: {}

# Ciclo de Vida y Desechabilidad (Factor IX - Twelve-Factor App)
# Permite apagado elegante (graceful shutdown) esperando el drenado de peticiones activas
lifeCycle:
  requestAcceptGraceTimeout: 5s
  graceTimeout: 10s

# Configuración de Logs
log:
  level: INFO
  format: common

accessLog:
  format: common

# Proveedores de configuración dinámica
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "pdf-network"
    watch: true
