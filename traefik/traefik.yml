# ==============================================================================
# Traefik v3.6 - Configuración Estática con HashiCorp Consul Catalog
# Infraestructura de Microservicios PDF - UTN FRSR
# ==============================================================================

# EntryPoints (Puntos de entrada de red)
entryPoints:
  web:
    address: ":80"
  traefik:
    address: ":8080"

# API y Dashboard de auditoría y monitoreo
# NOTA DE SEGURIDAD:
# En desarrollo local se utiliza insecure: true para acceso directo a métricas.
# El puerto 8080 está expresamente vinculado a 127.0.0.1 en docker-compose.yml
# para impedir cualquier acceso no autorizado desde interfaces públicas o red externa.
api:
  dashboard: true
  insecure: true

# Endpoint de salud de Traefik (/ping) para probes de disponibilidad
ping: {}

# Metricas para Prometheus (Observabilidad transversal - Factor XI)
metrics:
  prometheus:
    addServicesLabels: true
    addRoutersLabels: true
    entryPoint: traefik

# Ciclo de Vida y Desechabilidad (Factor IX - Twelve-Factor App)
# Permite apagado elegante (graceful shutdown) esperando el drenado de peticiones activas
lifeCycle:
  requestAcceptGraceTimeout: 5s
  graceTimeout: 10s

# Configuración de Logs
log:
  level: INFO
  format: common

accessLog:
  format: common

# Proveedores de configuración dinámica
providers:
  # 1. Proveedor de Archivos Dinámicos (Middlewares Centralizados de Resiliencia)
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

  # 2. Proveedor Docker (Reservado exclusivamente para Dashboard Interno de Traefik)
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "pdf-network"
    watch: true

  # 3. Proveedor HashiCorp Consul Catalog (Descubrimiento y balanceo dinámico de Microservicios)
  consulCatalog:
    endpoint:
      address: "consul:8500"
    prefix: "traefik"
    refreshInterval: "2s"
    exposedByDefault: false
    # Enrutar exclusivamente a instancias con health checks en estado 'passing' (ignora 'warning' y 'critical')
    strictChecks:
      - "passing"
