global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # 1. Metricas del Ingress Gateway (Traefik v3)
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  # 2. Metricas del Microservicio Extractor (DNS Service Discovery para resolver todas las replicas)
  - job_name: 'pdf-extractor'
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - extractor
        type: A
        port: 8000
        refresh_interval: 5s

  # 3. Metricas del Microservicio Documents (requiere Bearer Token segun contrato de seguridad)
  - job_name: 'pdf-documents'
    metrics_path: /metrics
    bearer_token: 'secret_token_integration_documents_32chars'
    static_configs:
      - targets: ['documents:8000']

  # 4. Metricas del Microservicio API (Pendiente: el servicio aun no expone endpoint /metrics)
  # - job_name: 'pdf-api'
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ['api:8000']
