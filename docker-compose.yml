services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - pdf-network
    labels:
      - "traefik.enable=true"
      # Router para el Dashboard vía hostname traefik.universidad.localhost
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DASHBOARD_DOMAIN:-traefik.universidad.localhost}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      # Servicio interno expuesto
      - "traefik.http.services.traefik-dashboard.loadbalancer.server.port=8080"

  # ----------------------------------------------------------------------------
  # Redis Cache - Perfil condicional 'cache' (Post-Baseline)
  # Solo se levanta explícitamente con: docker compose --profile cache up -d
  # Durante la prueba de carga baseline con k6 / Vegeta NO debe ejecutarse.
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles:
      - cache
    networks:
      - pdf-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  pdf-network:
    external: true
